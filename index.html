        :root {
            --bg-primary: #070e20;

        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 14px; background: rgba(7, 14, 32, 0.85);
            border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 13px;
        }
        .form-group select option { background: #0f1c3f; color: white; }

        .login-btn, .finder-btn {

            color: white; border: none; padding: 13px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 800; cursor: pointer; display: flex;

        }
        .login-btn:hover, .finder-btn:hover { opacity: 0.9; }

        .cred-box {

        .cred-header {

        }

            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cred-fill-btn:hover { background: var(--accent-blue); color: var(--bg-primary); }

        #dashboard-view { min-height: 100vh; flex-direction: column; }

        .header {
            background: rgba(7, 14, 32, 0.95); border-bottom: 1px solid var(--border-color);

        }

        }

            border-bottom: 1px solid var(--border-color); overflow-x: auto;

        .tab-btn.officer-tab.active { background: #dc2626; color: white; }

        .container { padding: 24px 30px; max-width: 1560px; margin: auto; width: 100%; }
